version: '3.8'

services:
  agripulse-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agripulse_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  agripulse-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agripulse_frontend
    ports:
      - "3000:80"
    depends_on:
      - agripulse-backend
    restart: unless-stopped